[workspace]
resolver = "2"
members = ["crates/dockview-domain", "crates/dockview-core", "crates/dockview-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
wasapi = "0.27"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
