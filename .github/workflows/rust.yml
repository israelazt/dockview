name: Rust

on:
  push:
    branches: [main, migration/rust]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A hosted runner has no capture card, GPU encoder or screen: the tests that
  # need them skip on purpose (see rust/crates/dockview-platform/src/test_support.rs).
  DOCKVIEW_NO_HARDWARE: "1"

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
