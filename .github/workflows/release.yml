name: Release

# Pushing a tag like v0.1.0 builds the program and publishes it as a GitHub
# release. Running the workflow by hand (Actions > Release > Run workflow)
# builds it and keeps the .exe as a downloadable artifact only, to try it out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --release -p dockview
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/dockview.exe dist/Dockview.exe
          $hash = (Get-FileHash dist/Dockview.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Dockview.exe" | Set-Content -Encoding ascii dist/Dockview.exe.sha256
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Dockview
          path: rust/dist/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/Dockview.exe dist/Dockview.exe.sha256
          --title "Dockview ${{ github.ref_name }}" --generate-notes --verify-tag
