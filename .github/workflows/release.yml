name: Release

# Pushing a tag like v0.1.0 builds the installer and the portable download,
# tries the installer (installs it to a scratch folder and uninstalls it) and
# publishes them as a GitHub release. Running the workflow by hand (Actions >
# Release > Run workflow) does the same but keeps the files as a downloadable
# artifact only, to try them out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the installer and the portable download
        shell: pwsh
        run: ./tools/build_installer.ps1
      - name: Try the installer (install, check, uninstall)
        shell: pwsh
        run: ./tools/test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Dockview
          path: dist/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          (Get-ChildItem dist/Dockview-*).FullName
          --title "Dockview ${{ github.ref_name }}" --generate-notes --verify-tag
